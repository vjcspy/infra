apiVersion: v1
kind: ConfigMap
metadata:
  name: dieuvang-config
  labels:
    {{- include "dieuvang.labels" . | nindent 4 }}
data:
  nginx-default.conf: |
{{ .Files.Get "files/nginx-default.conf" | indent 4 }}
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
  magento-build.sh: |
{{ .Files.Get "files/magento-build.sh" | indent 4 }}
  storefront-build.sh: |
{{ .Files.Get "files/storefront-build.sh" | indent 4 }}
