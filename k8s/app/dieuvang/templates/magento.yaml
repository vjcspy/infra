apiVersion: apps/v1
kind: Deployment
metadata:
  name: dieuvang-magento
  labels:
    {{- include "dieuvang.labels" . | nindent 4 }}
    app.kubernetes.io/component: magento
spec:
  replicas: {{ required "magento.replicas is required (scripts/deploy.sh passes it)" .Values.magento.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dieuvang.selector" (dict "root" . "component" "magento") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dieuvang.labels" . | nindent 8 }}
        app.kubernetes.io/component: magento
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      initContainers:
        {{- include "dieuvang.sentinel" (dict "root" . "db" false) | nindent 8 }}
      containers:
        - name: php-fpm
          image: {{ .Values.images.php }}
          securityContext:
            runAsUser: 1000
          # php-fpm listens on /sock/phpfpm.sock (image php-fpm.conf), shared with nginx through an emptyDir.
          readinessProbe:
            exec:
              command: ["test", "-S", "/sock/phpfpm.sock"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["test", "-S", "/sock/phpfpm.sock"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.phpfpm | nindent 12 }}
          volumeMounts:
            - name: app-volume
              mountPath: /var/www/html
              subPath: {{ .Values.hostPaths.appRoot }}/magento/src
            - name: sock
              mountPath: /sock
        - name: nginx
          image: {{ .Values.images.nginx }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health_check.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          volumeMounts:
            - name: app-volume
              mountPath: /var/www/html
              subPath: {{ .Values.hostPaths.appRoot }}/magento/src
            - name: sock
              mountPath: /sock
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        - name: cron
          image: {{ .Values.images.php }}
          securityContext:
            runAsUser: 1000
          workingDir: /var/www/html
          command:
            - bash
            - -c
            # One group at a time: a bare `cron:run` forks ~10 Magento processes at once (~1.7 GiB peak, OOM at 1Gi).
            - 'while true; do if [ -f app/etc/env.php ]; then for g in default index consumers; do php -d memory_limit=-1 bin/magento cron:run --group=$g >> var/log/cron-loop.log 2>&1; done; fi; sleep 60; done'
          resources:
            {{- toYaml .Values.resources.cron | nindent 12 }}
          volumeMounts:
            - name: app-volume
              mountPath: /var/www/html
              subPath: {{ .Values.hostPaths.appRoot }}/magento/src
      volumes:
        {{- include "dieuvang.appVolume" . | nindent 8 }}
        - name: sock
          emptyDir: {}
        - name: config
          configMap:
            name: dieuvang-config
---
apiVersion: v1
kind: Service
metadata:
  name: dieuvang-magento
  labels:
    {{- include "dieuvang.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "dieuvang.selector" (dict "root" . "component" "magento") | nindent 4 }}
