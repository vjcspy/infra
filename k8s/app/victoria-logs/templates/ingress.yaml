{{- if .Values.ingress.enabled }}
# Only the /select prefix is routed; /insert, /internal and /metrics stay cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "victoria-logs.fullname" . }}
  labels:
    {{- include "victoria-logs.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.basicAuth.secret }}
    nginx.ingress.kubernetes.io/auth-realm: "VictoriaLogs - authentication required"
    {{- end }}
    {{- with .Values.ingress.appRoot }}
    nginx.ingress.kubernetes.io/app-root: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /select
            pathType: Prefix
            backend:
              service:
                name: {{ include "victoria-logs.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
