# fluent-bit-values.yaml - jmeta-stock and metan-stock container logs -> VictoriaLogs (http jsonline).
# No secrets here. Canonical guide: resources/workspaces/k/infrastructure/_guides/victorialogs-production-logs.md

kind: DaemonSet

replicaCount: 1

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 4.0.3
  digest:
  pullPolicy: IfNotPresent

testFramework:
  enabled: true
  namespace:
  image:
    repository: busybox
    pullPolicy: Always
    tag: latest
    digest:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: fluent-bit

rbac:
  create: true
  nodeAccess: false
  eventsAccess: false

podSecurityPolicy:
  create: false
  annotations: {}
  runAsUser:
    rule: RunAsAny
  seLinux:
    rule: RunAsAny

openShift:
  enabled: false
  securityContextConstraints:
    create: true
    name: ""
    annotations: {}
    runAsUser:
      type: RunAsAny
    seLinuxContext:
      type: MustRunAs
    existingName: ""

podSecurityContext: {}

hostNetwork: false
dnsPolicy: ClusterFirst

dnsConfig: {}

hostAliases: []

securityContext: {}

service:
  type: ClusterIP
  port: 2020
  internalTrafficPolicy:
  loadBalancerClass:
  loadBalancerSourceRanges: []
  loadBalancerIP:
  labels: {}
  annotations: {}
  externalIPs: []

serviceMonitor:
  enabled: false
  additionalEndpoints: []

prometheusRule:
  enabled: false

dashboards:
  enabled: false
  labelKey: grafana_dashboard
  labelValue: 1
  annotations: {}
  namespace: ""
  deterministicUid: false

lifecycle: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

resources:
  limits:
    memory: 256Mi
    cpu: 200m
  requests:
    memory: 64Mi
    cpu: 50m

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  extraHosts: []
  tls: []

autoscaling:
  vpa:
    enabled: false
    annotations: {}
    controlledResources: []
    controlledValues:
    maxAllowed: {}
    minAllowed: {}
    updatePolicy:
      updateMode: Auto
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  customRules: []
  behavior: {}

podDisruptionBudget:
  enabled: false
  annotations: {}
  maxUnavailable: "30%"

nodeSelector: {}

tolerations: []

affinity: {}

labels: {}
annotations: {}
podAnnotations: {}
podLabels: {}

minReadySeconds: 0
terminationGracePeriodSeconds: 30

priorityClassName: ""

envWithTpl: []
envFrom: []
extraContainers: []
flush: 1
metricsPort: 2020
extraPorts: []

extraVolumes: []
extraVolumeMounts: []

updateStrategy: {}

existingConfigMap: ""
networkPolicy:
  enabled: false

luaScripts: {}

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On
        storage.path /var/log/flb-storage/
        storage.sync normal
        storage.checkpoint on
        storage.max_chunks_up 16
        storage.backlog.mem_limit 16M

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_jmeta-stock_jmeta-*.log,/var/log/containers/*_metan-stock_metan-*.log
        Tag kube.*
        multiline.parser cri
        storage.type filesystem
        DB /var/log/flb_kube_vlogs.db
        DB.compare_filename On
        Read_from_Head On
        Refresh_Interval 5
        Rotate_Wait 30
        Skip_Long_Lines Off
        Buffer_Max_Size 1M

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        Labels Off
        Annotations Off
        K8S-Logging.Parser Off
        K8S-Logging.Exclude Off

    [FILTER]
        Name nest
        Match kube.*
        Operation lift
        Nested_under kubernetes
        Add_prefix kubernetes_

    [FILTER]
        Name modify
        Match kube.*
        Rename kubernetes_namespace_name namespace
        Rename kubernetes_container_name container
        Rename kubernetes_pod_name pod
        Remove kubernetes_host
        Remove kubernetes_docker_id
        Remove kubernetes_container_hash
        Remove kubernetes_container_image
        Remove kubernetes_pod_id
        Remove kubernetes_pod_ip
        Remove _p

  outputs: |
    [OUTPUT]
        Name http
        Match kube.*
        Host victoria-logs.victoria-logs.svc.cluster.local
        Port 9428
        URI /insert/jsonline?_stream_fields=namespace,container&_msg_field=message,msg,log&_time_field=_time
        Format json_lines
        json_date_key _time
        json_date_format iso8601
        Retry_Limit no_limits
        storage.total_limit_size 1G
        # The time key must be _time (VictoriaLogs' own field): a custom key such as `date` collides with app fields
        # (jmeta logs date as an array) and VictoriaLogs then drops those lines with HTTP 200.

  upstream: {}

  customParsers: |
    # none: the built-in cri multiline parser and Merge_Log replace the old custom parsers

  extraFiles: {}

volumeMounts:
  - name: config
    mountPath: /fluent-bit/etc/conf

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/log/containers
      type: DirectoryOrCreate
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: FileOrCreate
  # App EBS root, fail-closed (type: Directory, never DirectoryOrCreate on a data path);
  # the collector mounts only subPath fluent-bit/storage, the init container checks the sentinel at the root.
  - name: ebs-root
    hostPath:
      path: /mnt/existing_ebs_volume
      type: Directory

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/log/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true
  - name: ebs-root
    mountPath: /var/log/flb-storage
    subPath: fluent-bit/storage
    readOnly: false

command:
  - /fluent-bit/bin/fluent-bit

args:
  - --workdir=/fluent-bit/etc
  - --config=/fluent-bit/etc/conf/fluent-bit.conf

initContainers:
  - name: init-container-check-host-mounted-ebs-volume
    image: busybox
    command: [ 'sh', '-c', 'for i in $(seq 1 5); do echo "Checking attempt $i..."; if [ -f /host_ebs_volume/DONT_DELETE ]; then echo "File found, exiting successfully."; exit 0; fi; echo "File not found, retrying..."; sleep 10; done; echo "File not found after 5 attempts, exiting with error."; exit 1' ]
    volumeMounts:
      - name: ebs-root
        mountPath: /host_ebs_volume
        readOnly: true

logLevel: info

hotReload:
  enabled: false
  image:
    repository: ghcr.io/jimmidyson/configmap-reload
    tag: v0.14.0
    digest:
    pullPolicy: IfNotPresent
  resources: {}
  extraWatchVolumes: []